[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omai"
version = "0.1.0"
description = "Read-only Ometrics AI assistant."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "pymysql>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
