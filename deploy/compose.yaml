name: omai-demo

services:
  omai:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    ports:
      - "50009:50009"
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      omreports:
        condition: service_healthy
      graphite:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:50009/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
      - data

  omreports:
    build:
      context: ${OMREPORTS_SOURCE_DIR:-../../omreports}
    restart: unless-stopped
    env_file: .env
    environment:
      OMREPORTS_ALLOWED_CLIENT_NETWORKS: 172.31.0.0/24
    expose:
      - "50008"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:50008/openapi.json').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
      - data

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${VECTOR_DB_NAME}
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-5
    restart: unless-stopped
    volumes:
      - graphite-data:/opt/graphite/storage
    networks:
      - app

networks:
  app:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24

volumes:
  mariadb-data:
  postgres-data:
  graphite-data:
